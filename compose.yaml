name: deeprl-practice

x-environment: &environment
  image: deeprl-practice:py311-cu128
  build:
    context: .
    dockerfile: Dockerfile

services:
  runner:
    <<: *environment
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: .
        target: /workspace
    command: ["bash"]

  tensorboard:
    <<: *environment
    profiles: ["monitoring"]
    init: true
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    ports:
      - "127.0.0.1:6006:6006"
    command:
      - tensorboard
      - --logdir=/workspace
      - --host=0.0.0.0
      - --port=6006
      - --load_fast=false
