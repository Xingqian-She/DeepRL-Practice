[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-shared"
version = "0.1.0"
description = "Decoupled temporal Transformer components for reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.9.1"]

[tool.setuptools.packages.find]
where = ["src"]
